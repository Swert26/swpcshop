<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ выполнен | Спасибо за покупку!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* декоративные элементы фона */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            top: -150px;
            right: -150px;
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 70%);
            bottom: -200px;
            left: -200px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* летающие конфетти */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ffd700;
            position: absolute;
            animation: confetti-fall 3s linear forwards;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* основная карточка */
        .success-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 8px 20px -8px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 550px;
            padding: 2.5rem;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s ease-out;
            backdrop-filter: blur(2px);
        }

        .success-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        /* анимированная иконка успеха */
        .success-icon {
            margin-bottom: 1.5rem;
            animation: bounce 0.5s ease-out 0.3s both;
        }

        .checkmark-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #48bb78, #38a169);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 10px 25px -5px rgba(72, 187, 120, 0.4);
        }

        .checkmark {
            font-size: 3.5rem;
            color: white;
            animation: checkmark 0.4s ease-out 0.5s both;
        }

        @keyframes bounce {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            60% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes checkmark {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* заголовок */
        .success-container h1 {
            font-size: 2rem;
            color: #2d3748;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .success-container h1::before {
            content: "🎉";
            font-size: 1.8rem;
            animation: wave 0.5s ease-out 0.8s both;
        }

        .success-container h1::after {
            content: "✨";
            font-size: 1.8rem;
            animation: wave 0.5s ease-out 0.8s both;
        }

        @keyframes wave {
            0% {
                transform: rotate(0deg);
                opacity: 0;
            }
            100% {
                transform: rotate(20deg);
                opacity: 1;
            }
        }

        /* подзаголовок */
        .success-message {
            color: #718096;
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.5;
        }

        /* детали заказа */
        .order-details {
            background: #f7fafc;
            border-radius: 1rem;
            padding: 1.25rem;
            margin: 1.5rem 0;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .detail-value {
            color: #2d3748;
            font-weight: 500;
        }

        /* информация о доставке */
        .delivery-info {
            background: linear-gradient(135deg, #edf2f7, #e2e8f0);
            border-radius: 1rem;
            padding: 1rem;
            margin: 1rem 0;
            font-size: 0.85rem;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .delivery-info::before {
            content: "🚚";
            font-size: 1.2rem;
        }

        .delivery-info::after {
            content: "📦";
            font-size: 1.2rem;
        }

        /* кнопка */
        .catalog-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .catalog-btn::before {
            content: "🛍️";
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .catalog-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.5);
            background: linear-gradient(135deg, #764ba2, #667eea);
        }

        .catalog-btn:hover::before {
            transform: translateX(-3px);
        }

        .catalog-btn:active {
            transform: translateY(1px);
        }

        /* анимация появления */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* дополнительные украшения */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            opacity: 0;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* медиа-запросы */
        @media (max-width: 640px) {
            .success-container {
                padding: 1.75rem;
                margin: 1rem;
            }

            .checkmark-circle {
                width: 75px;
                height: 75px;
            }

            .checkmark {
                font-size: 2.5rem;
            }

            .success-container h1 {
                font-size: 1.5rem;
            }

            .success-container h1::before,
            .success-container h1::after {
                font-size: 1.3rem;
            }

            .detail-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.25rem;
            }

            .catalog-btn {
                padding: 0.8rem 1.5rem;
                font-size: 0.9rem;
            }
        }

        /* номер заказа (если нужно) */
        .order-number {
            font-size: 0.85rem;
            color: #a0aec0;
            margin-top: 0.5rem;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <div class="checkmark-circle">
                <div class="checkmark">✓</div>
            </div>
        </div>
        
        <h1>Заказ выполнен!</h1>
        
        <div class="success-message">
            Спасибо за покупку! Наш менеджер свяжется с вами в ближайшее время для подтверждения заказа.
        </div>
        <a href="/catalog" class="catalog-btn">В каталог за покупками</a>
    </div>
</body>
</html>
