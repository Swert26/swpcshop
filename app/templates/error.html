<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index - Панель навигации</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          sans-serif;
        background: linear-gradient(145deg, #f6f9fc 0%, #eef2f5 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
      }

      /* стеклянная карточка-меню */
      .nav-glass {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(16px);
        border-radius: 3rem;
        box-shadow:
          0 20px 40px -12px rgba(0, 0, 0, 0.2),
          0 4px 12px rgba(0, 0, 0, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
        padding: 1rem 2rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.6);
        transition: all 0.2s ease;
      }

      /* стили ссылок */
      .nav-glass a {
        text-decoration: none;
        font-weight: 600;
        font-size: 1.1rem;
        padding: 0.6rem 1.4rem;
        border-radius: 3rem;
        background: transparent;
        color: #1a2c3e;
        letter-spacing: -0.01em;
        transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        border: 1px solid transparent;
        backdrop-filter: blur(4px);
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }

      /* иконки через псевдоэлементы — добавляют лёгкую графику */
      .nav-glass a[href="/register"]::before {
        content: "✨";
        font-size: 1.1rem;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.1));
      }
      .nav-glass a[href="/login"]::before {
        content: "🔐";
        font-size: 1.05rem;
      }
      .nav-glass a[href="/profile"]::before {
        content: "👤";
      }
      .nav-glass a[href="/catalog"]::before {
        content: "📚";
      }
      .nav-glass a[href="/admin_panel"]::before {
        content: "⚙️";
        font-size: 1rem;
      }

      /* ховер эффекты */
      .nav-glass a:hover {
        background: rgba(255, 255, 255, 0.9);
        border-color: rgba(72, 187, 255, 0.5);
        color: #0f2b3b;
        transform: translateY(-3px);
        box-shadow: 0 10px 18px -8px rgba(0, 0, 0, 0.2);
      }

      /* активное состояние (клик) */
      .nav-glass a:active {
        transform: translateY(2px);
        transition: 0.05s;
      }

      /* особый акцент для админ-панели (тонкое выделение) */
      .nav-glass a[href="/admin_panel"] {
        background: rgba(0, 0, 0, 0.03);
        border-color: rgba(0, 0, 0, 0.08);
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.6),
          0 1px 2px rgba(0, 0, 0, 0.02);
      }
      .nav-glass a[href="/admin_panel"]:hover {
        background: #ffe6e6;
        border-color: #ff9e9e;
        color: #9b2c2c;
      }

      /* адаптив: на маленьких экранах меню становится колонкой, но компактно */
      @media (max-width: 550px) {
        body {
          padding: 1rem;
          align-items: flex-start;
        }
        .nav-glass {
          flex-direction: column;
          width: 100%;
          border-radius: 2rem;
          padding: 1.2rem;
          gap: 0.6rem;
          background: rgba(255, 255, 255, 0.85);
        }
        .nav-glass a {
          justify-content: center;
          padding: 0.7rem 1rem;
          background: rgba(255, 255, 240, 0.5);
          border: 1px solid rgba(0, 0, 0, 0.05);
        }
      }

      /* легкий анимированный градиент на фон body (опционально) */
      @keyframes subtleShift {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 100% 50%;
        }
      }
      body {
        background-size: 120% 120%;
        animation: subtleShift 12s infinite alternate ease-in-out;
      }

      /* небольшой титул/приветствие для атмосферы */
      .greeting {
        text-align: center;
        margin-bottom: 2rem;
        font-weight: 500;
        color: #2c4c6e;
        text-shadow: 0 1px 1px white;
      }
      .greeting h1 {
        font-weight: 600;
        font-size: 1.9rem;
        letter-spacing: -0.3px;
      }
      .greeting p {
        opacity: 0.7;
        margin-top: 0.4rem;
      }

      /* контейнер, чтобы объединить приветствие и меню */
      .dashboard {
        max-width: 780px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <div class="greeting">
        <h1>Ошибка {{ error }}</h1>
        <p>Произошла ошибка, за поддержкой обращаться на swert0.260@mail.ru</p>
      </div>
      <div class="nav-glass">
        <a href="/">Вернуться</a>
      </div>
    </div>
  </body>
</html>
